[package]
name = "uu-irc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "time"] }

[dependencies.uu-irc]
path = ".."
default-features = false
features = ["net"]




[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reader"
path = "fuzz_targets/reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tags"
path = "fuzz_targets/tags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "display"
path = "fuzz_targets/display.rs"
test = false
doc = false
bench = false
